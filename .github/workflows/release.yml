name: Release

# 发布产物的校验与签名：
#   - 构建 Windows / Linux amd64 / Linux arm64 三个产物
#   - 生成 SHA256SUMS + 用 cosign/sigstore 做无密钥签名（默认可用）
#   - 上传 GitHub Release
# 触发：git tag v0.5.1 && git push --tags

on:
  push:
    tags: ["v*.*.*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v0.5.1）"
        required: true

permissions:
  contents: write
  id-token: write # cosign 的 keyless signing 需要

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: nfrp-windows-amd64.zip
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: nfrp-linux-amd64.tar.gz
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: nfrp-linux-arm64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: install cross (linux targets)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cross

      - name: build --release
        env:
          CROSS_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
          CROSS_TARGET_X86_64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/x86_64-unknown-linux-musl:main
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cross build --release --workspace --target ${{ matrix.target }}
          else
            cargo build --release --workspace --target ${{ matrix.target }}
          fi
        shell: bash
        timeout-minutes: 40

      - name: package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/${{ matrix.target }}/release/nfrp-server.exe staging/frps.exe
          Copy-Item target/${{ matrix.target }}/release/nfrp-client.exe staging/frpc.exe
          # 与 scripts/release.py 打出的包保持同样的组成：README + LICENSE + NOTICE + 示例配置
          Copy-Item README.md, LICENSE, NOTICE staging/ -ErrorAction SilentlyContinue
          Copy-Item assets/frps.toml, assets/frpc.toml staging/ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset }}

      - name: package (tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/nfrp-server staging/frps
          cp target/${{ matrix.target }}/release/nfrp-client staging/frpc
          # 与 scripts/release.py 打出的包保持同样的组成
          cp README.md LICENSE NOTICE staging/ 2>/dev/null || true
          cp assets/frps.toml assets/frpc.toml staging/ 2>/dev/null || true
          tar czf ${{ matrix.asset }} -C staging .

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  checksums:
    name: checksums + signature
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: flatten artifacts
        run: |
          mkdir -p out
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} out/ \;
          ls -l out

      - name: generate SHA256SUMS
        run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # ★★ 签名必须"真的签出来"（v0.5.3 修）。
      #
      # 这里原来两个步骤都写了 `continue-on-error: true`，shell 里还有
      # `|| echo "::warning::..."` —— 三重失效叠加，结果是
      # **一个字节都没签出来这条流水线也会全绿通过**，Release 里剩一个
      # 谁都能替换的裸 SHA256SUMS。而 README 宣称"发布可验真"，
      # 那在 CI 这条路径上是不成立的（自相矛盾的发布比没有签名更糟）。
      #
      # 现在：装不上 cosign 或签名失败 = **红灯**，不允许"看起来签过了"。
      # 紧接着加一步 verify-blob 自检，确保签出来的东西当场能验。
      - name: sign with cosign (keyless)
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: cosign sign blobs
        run: |
          cd out
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            case "$f" in *.sig) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sig" "$f"
          done
          cosign sign-blob --yes --bundle SHA256SUMS.sig SHA256SUMS
          echo "--- 签出来的文件 ---"
          ls -la *.sig

      # ★★ v0.5.4 修（M2）：**逐个**验证所有签名，并断言"每个产物都有对应签名"。
      #
      # 原先只验了 `SHA256SUMS.sig` 一个（4 个签名里的 1 个），
      # 于是"某个包的签名丢了/签错了"这条流水线完全无感。
      - name: verify signatures
        run: |
          set -euo pipefail
          cd out

          # 1) 每个非 .sig 产物都必须有 .sig（缺一即失败）
          missing=0
          for f in *; do
            case "$f" in
              *.sig|SHA256SUMS) continue ;;
            esac
            if [ ! -f "$f.sig" ]; then
              echo "::error::产物 $f 没有对应签名"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # 2) 逐个验签（不是只验 SHA256SUMS 那一个）
          for sig in *.sig; do
            target="${sig%.sig}"
            echo "--- verify $target ---"
            cosign verify-blob \
              --certificate-identity-regexp '^https://github.com/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --bundle "$sig" "$target"
          done

          # 3) SHA256SUMS 自身的签名也要验
          cosign verify-blob \
            --certificate-identity-regexp '^https://github.com/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle SHA256SUMS.sig SHA256SUMS
          echo "全部签名验证通过"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          # ★ 必须连 `*.sig` 一起传：只传 SHA256SUMS 的话，上面 cosign 签出来的
          # 分离签名会随着 job 结束一起消失，Release 里只剩一个没人能验证的校验和文件。
          path: |
            out/SHA256SUMS
            out/*.sig

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [build, checksums]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: flatten
        run: |
          mkdir -p out
          find dist -type f ! -name '*.md' -exec cp {} out/ \;
          ls -l out

      - name: create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # ★ 显式给 tag_name：手动触发（workflow_dispatch）时 `github.ref_name` 是
          # **分支名**，不指定的话会打出个叫 `main` 的 Release。
          # 打 tag 触发时 ref_name 就是标签本身，表达式的右侧兜底。
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            out/*
          generate_release_notes: true
          fail_on_unmatched_files: false


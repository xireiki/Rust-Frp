name: CI

# 回归全靠本地手跑十个脚本 —— 这是最容易出事的一环：
# 任何人改一行 `lookup()` 都可能悄悄破坏官方 frp 互通，而本地未必跑得到。
# 这里把 fmt / clippy / 单测 / 冒烟串成一条流水线，push 和 PR 都拦一次。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------
  # 静态检查：最快失败，别让格式问题占用后面的编译机时
  # ---------------------------------------------------------------
  lint:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (含测试代码)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 依赖漏洞门禁。
      #
      # v0.5.1 发版时锁的 rustls 0.23.44 带着 RUSTSEC-2026-0285
      # （TLS 1.3 握手消息被跨加密层级错误接受），而当时没有任何环节
      # 会去查 —— 是事后人工跑 cargo audit 才发现的。加这一步是为了
      # **下一次不用靠人想起来**。
      #
      # 用 rustsec/audit-check 而不是裸 `cargo install cargo-audit`：
      # 前者带缓存、失败时会把公告直接写进 job summary。
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # 单元测试：三个 crate + 两个二进制全部跑
  # ---------------------------------------------------------------
  test:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo test
        run: cargo test --workspace --all-targets
        timeout-minutes: 20

  # ---------------------------------------------------------------
  # 构建发布包（Linux 走 cross 交叉编译，Windows 原生）并上传为工件
  # 提前在 CI 里跑一遍，避免 tag 那天才发现某个目标平台编不过
  # ---------------------------------------------------------------
  cross-build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        if: runner.os == 'Linux'
        with:
          tool: cross

      - name: build --release
        env:
          CROSS_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
          CROSS_TARGET_X86_64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/x86_64-unknown-linux-musl:main
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cross build --release --workspace --target ${{ matrix.target }}
          else
            cargo build --release --workspace --target ${{ matrix.target }}
          fi
        timeout-minutes: 30

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfrp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/nfrp-server${{ matrix.ext }}
            target/${{ matrix.target }}/release/nfrp-client${{ matrix.ext }}
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 端到端冒烟：真跑一次 frps + frpc，验证 TCP / HTTP / stcp 转发能用
  # 这是唯一能覆盖"握手协议改坏了"的检查 —— 单测再全也测不到
  # ---------------------------------------------------------------
  smoke:
    name: e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: build binaries
        run: cargo build --release --workspace
        timeout-minutes: 20

      - name: run integration tests
        run: cargo test --workspace --release --test '*'
        timeout-minutes: 10

      - name: check --gen-config works and produced config reloads
        run: |
          ./target/release/nfrp-server --gen-config /tmp/frps.toml
          ./target/release/nfrp-client --gen-config /tmp/frpc.toml
          ./target/release/nfrp-server --check -c /tmp/frps.toml
          ./target/release/nfrp-client --print-example > /dev/null
